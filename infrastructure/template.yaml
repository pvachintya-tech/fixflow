AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FixFlow backend

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256

Resources:

  ComplaintsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${FixFlowUserPool}"
              audience:
                - !Ref FixFlowUserPoolClient
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - content-type
          - authorization
        AllowMethods:
          - POST
          - GET
          - PATCH
          - OPTIONS

  FixFlowUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: fixflow-users
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  FixFlowAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      UserPoolId: !Ref FixFlowUserPool
      Description: FixFlow administrators

  FixFlowUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: fixflow-web-client
      UserPoolId: !Ref FixFlowUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  SlaCheckerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: src.handlers.sla.lambda_handler
      Runtime: python3.13
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          INCIDENTS_TABLE_NAME: !Ref IncidentsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
      Events:
        SlaSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: true

  ComplaintsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: src/handlers/complaints.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ComplaintsTable
          AI_MODEL_ID: amazon.nova-micro-v1:0
          REGISTRY_TABLE_NAME: !Ref CampusRegistryTable
          OPENSEARCH_ENDPOINT: https://93kagp5pk759h9qid4x8.us-east-1.aoss.amazonaws.com
          INCIDENTS_TABLE_NAME: !Ref IncidentsTable
          EVIDENCE_BUCKET: !Ref EvidenceBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ComplaintsTable

        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt CampusRegistryTable.Arn
        - Statement:
            - Effect: Allow
              Action:
                - aoss:APIAccessAll
              Resource: arn:aws:aoss:us-east-1:*:collection/93kagp5pk759h9qid4x8

        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable

        - S3WritePolicy:
            BucketName: !Ref EvidenceBucket

      Events:
        CreateComplaint:
          Type: HttpApi
          Properties:
            ApiId: !Ref ComplaintsApi
            Path: /complaints
            Method: POST

        ListIncidents:
          Type: HttpApi
          Properties:
            ApiId: !Ref ComplaintsApi
            Path: /incidents
            Method: GET

        UpdateIncident:
          Type: HttpApi
          Properties:
            ApiId: !Ref ComplaintsApi
            Path: /incidents/{incidentId}
            Method: PATCH

        CreateEvidenceUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref ComplaintsApi
            Path: /evidence/upload-url
            Method: POST

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "*"
            AllowedMethods:
              - PUT
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag

  ComplaintsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fixflow-complaints
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: complaintId
          AttributeType: S
      KeySchema:
        - AttributeName: complaintId
          KeyType: HASH

  CampusRegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fixflow-campus-registry
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH

  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fixflow-incidents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incidentId
          AttributeType: S
      KeySchema:
        - AttributeName: incidentId
          KeyType: HASH

Outputs:

  ApiUrl:
    Description: FixFlow API endpoint
    Value: !Sub "https://${ComplaintsApi}.execute-api.${AWS::Region}.amazonaws.com"

  ComplaintsTableName:
    Description: DynamoDB table name
    Value: !Ref ComplaintsTable

  UserPoolId:
    Description: FixFlow Cognito User Pool
    Value: !Ref FixFlowUserPool

  UserPoolClientId:
    Description: FixFlow Cognito app client
    Value: !Ref FixFlowUserPoolClient
